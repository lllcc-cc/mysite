<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台 · 编辑内容</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .admin { max-width: 760px; margin: 0 auto; padding: 80px 24px 80px; }
  .admin h1 { font-size: 1.4rem; letter-spacing: .06em; margin-bottom: 8px; }
  .admin .sub { font-family: var(--mono); font-size: .8rem; color: var(--ink-dim); margin-bottom: 40px; letter-spacing: .08em; }
  .field { margin-bottom: 22px; }
  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .16em;
    color: var(--ink-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .field input, .field textarea {
    width: 100%;
    padding: 11px 14px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    font-family: var(--sans);
    font-size: .92rem;
    line-height: 1.6;
    transition: .2s;
  }
  .field textarea { resize: vertical; min-height: 88px; }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--acc);
    box-shadow: 0 0 0 3px rgba(110,231,183,.1);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .card {
    border: 1px solid var(--line);
    background: var(--bg2);
    padding: 20px;
    margin-bottom: 18px;
    position: relative;
  }
  .card-num {
    position: absolute;
    top: 16px; right: 18px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: .1em;
  }
  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .18em;
    color: var(--acc);
    margin: 36px 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .btn-row { display: flex; gap: 12px; margin-top: 32px; }
  .btn-row .btn { flex: 1; }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--line2);
    color: var(--ink-soft);
  }
  .btn.secondary:hover { border-color: var(--acc); color: var(--acc); filter: none; }
  .msg {
    margin-top: 18px;
    font-family: var(--mono);
    font-size: .82rem;
    min-height: 1.4em;
  }
  .msg.ok { color: var(--acc); }
  .msg.err { color: #f87171; }
  .hint {
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--ink-dim);
    margin-top: 6px;
    letter-spacing: .04em;
  }
  .back {
    display: inline-block;
    font-family: var(--mono);
    font-size: .8rem;
    color: var(--ink-soft);
    text-decoration: none;
    margin-bottom: 30px;
    letter-spacing: .08em;
  }
  .back:hover { color: var(--acc); }
  @media (max-width: 620px) {
    .row2, .row3 { grid-template-columns: 1fr; }
    .admin { padding: 60px 18px; }
  }
</style>
</head>
<body>

<div class="statusbar">
  <span class="dot"></span>
  <span>ADMIN</span>
  <span class="sep">/</span>
  <span id="clock">--:--:--</span>
  <span class="spacer"></span>
  <span class="ver">content editor</span>
</div>

<div class="admin">
  <a href="./" class="back">← 回首页</a>

  <h1>编辑内容</h1>
  <p class="sub">改完点保存，线上立刻生效</p>

  <!-- 密码 -->
  <div class="field">
    <label>管理密码</label>
    <input type="password" id="pass" placeholder="输入密码才能保存" autocomplete="current-password">
    <div class="hint">密码存在浏览器里，下次不用重输</div>
  </div>

  <div class="section-title">首屏</div>

  <div class="field">
    <label>名字</label>
    <input id="name" maxlength="24" placeholder="素菜粥">
  </div>

  <div class="field">
    <label>英文名（大写，显示在名字右边）</label>
    <input id="en" maxlength="40" placeholder="SUCAIZHOU">
  </div>

  <div class="field">
    <label>简介</label>
    <textarea id="tagline" maxlength="200" placeholder="写你想写的。支持换行。"></textarea>
    <div class="hint">最多 200 字，换行会原样显示</div>
  </div>

  <div class="section-title">元信息（首屏那张三格表）</div>
  <div class="row3">
    <div class="field">
      <label>第一格 · 标题</label>
      <input id="mk1" maxlength="16" placeholder="ROLE">
    </div>
    <div class="field">
      <label>第一格 · 内容</label>
      <input id="mv1" maxlength="40" placeholder="Developer">
    </div>
    <div class="field"></div>
  </div>
  <div class="row3">
    <div class="field">
      <label>第二格 · 标题</label>
      <input id="mk2" maxlength="16" placeholder="STATUS">
    </div>
    <div class="field">
      <label>第二格 · 内容</label>
      <input id="mv2" maxlength="40" placeholder="Building">
    </div>
    <div class="field"></div>
  </div>
  <div class="row3">
    <div class="field">
      <label>第三格 · 标题</label>
      <input id="mk3" maxlength="16" placeholder="STACK">
    </div>
    <div class="field">
      <label>第三格 · 内容</label>
      <input id="mv3" maxlength="40" placeholder="JS / Python / Java">
    </div>
    <div class="field"></div>
  </div>

  <div class="section-title">作品（最多 8 个，留空的不显示）</div>
  <div id="worksWrap"></div>
  <button type="button" class="btn secondary" id="addWork" style="width:100%;margin-bottom:8px">+ 再加一个作品</button>

  <div class="section-title">关于（最多 8 格，两列排）</div>
  <div id="aboutWrap"></div>
  <button type="button" class="btn secondary" id="addAbout" style="width:100%;margin-bottom:8px">+ 再加一格</button>

  <div class="btn-row">
    <button class="btn" id="save">保存</button>
    <button class="btn secondary" id="reload">重新读取</button>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
