name = "mysite"
compatibility_date = "2024-12-01"
pages_build_output_dir = "."

# ==========================================
# KV 绑定（留言板要存数据）
# ==========================================
# 步骤：
#   1. Cloudflare 后台 → Workers & Pages → KV → Create namespace → 名字随便（如 mysite-kv）
#   2. 建好后点进去，复制那串 ID
#   3. 把 ID 填到下面 id = "" 里
#   4. 或者干脆不填，直接在 Pages 项目 Settings → Functions 里绑也行
[[kv_namespaces]]
binding = "BOARD_KV"
id = ""

# ==========================================
# 环境变量（AI）
# ==========================================
# 不要写在这！用 Cloudflare 后台设置：
#   Pages 项目 → Settings → Environment variables → 加 AI_KEY
#
# 本地开发时，复制 .dev.vars.example 为 .dev.vars 填进去
[vars]
# AI_BASE = "https://api.deepseek.com/chat/completions"
# AI_MODEL = "deepseek-chat"